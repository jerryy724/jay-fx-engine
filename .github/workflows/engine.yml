name: Jay Empire Trading Engine Workflow

on:
  schedule:
    # 1. Tracker: Runs at 15, 30, and 45 minutes past the hour
    - cron: '15,30,45 * * * *'
    # 2. News Dispatch: Runs twice daily at 07:00 and 13:00 UTC
    - cron: '0 7,13 * * *'
  repository_dispatch:
    types: [engine_trigger]
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Action to execute (signal, prealert, tracker, news)'
        required: false
        default: 'signal'

concurrency:
  group: jay-empire-trading-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Determine Action Type
        id: determine_action
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            CRON_EXPR="${{ github.event.schedule }}"
            if [ "$CRON_EXPR" == "0 7,13 * * *" ]; then
              echo "ACTION=news" >> $GITHUB_OUTPUT
            else
              echo "ACTION=tracker" >> $GITHUB_OUTPUT
            fi
          else
            ACTION="${{ github.event.client_payload.ACTION_TYPE || github.event.client_payload.action || inputs.action_type || 'signal' }}"
            echo "ACTION=$ACTION" >> $GITHUB_OUTPUT
          fi

      - name: Execute Jay Empire Engine Module
        env:
          ACTION_TYPE: ${{ steps.determine_action.outputs.ACTION }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py $ACTION_TYPE

      - name: Commit and Push Updated Trade Logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "JayEmpireBot"
          git config --global user.email "bot@jayempire.com"
          git add trades.json
          if git diff-index --quiet HEAD; then
            echo "No new trade logs to commit"
          else
            git commit -m "auto: update trade tracking logs"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push rejected, retrying ($i)..."
              sleep 3
            done
          fi
